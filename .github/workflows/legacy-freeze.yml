name: Freeze legacy prompt corpus

on:
  push:
    branches:
      - revival/prompts-v2
    paths:
      - .github/workflows/legacy-freeze.yml

permissions:
  contents: write

concurrency:
  group: prompts-v2-legacy-freeze
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out revival branch with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: revival/prompts-v2

      - name: Create byte-identical legacy archive and SHA-256 manifest
        env:
          SOURCE_COMMIT: 9c7071b83f3928b62acc4f030e50c0deed13e2ad
          REVIVAL_BRANCH: revival/prompts-v2
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          source_commit = os.environ["SOURCE_COMMIT"]
          files = [
              "README.md",
              "COMPARE_ALPHA v1.md",
              "CRIME_ALPHA v1.md",
              "GEOPOL_ALPHA v1.md",
              "GROK_APEX_4.4.md",
              "GROK_PROMPTING_GUIDE.md",
              "KLEON_CREATIVE_LAYER_v1.1.md",
              "META_SCIENCE_INVESTIGATION_v1.1.md",
              "THE ALPHA SUITE v1.0.md",
              "VAL_FRAMEWORK.md",
          ]

          def git_bytes(*args: str) -> bytes:
              return subprocess.check_output(["git", *args])

          def git_text(*args: str) -> str:
              return git_bytes(*args).decode("utf-8").strip()

          manifest_path = pathlib.Path("LEGACY_MANIFEST.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          by_path = {entry["path"]: entry for entry in manifest["legacy_files"]}

          if set(by_path) != set(files):
              raise SystemExit("LEGACY_MANIFEST.json file list does not match frozen source list")

          legacy_root = pathlib.Path("legacy")
          legacy_root.mkdir(exist_ok=True)

          sums = []
          receipt_files = []
          for source_path in files:
              payload = git_bytes("show", f"{source_commit}:{source_path}")
              legacy_path = legacy_root / source_path
              legacy_path.parent.mkdir(parents=True, exist_ok=True)
              legacy_path.write_bytes(payload)

              source_blob = git_text("rev-parse", f"{source_commit}:{source_path}")
              copied_blob = git_text("hash-object", str(legacy_path))
              if copied_blob != source_blob:
                  raise SystemExit(f"byte identity failure for {source_path}")

              sha256 = hashlib.sha256(payload).hexdigest()
              size = len(payload)
              entry = by_path[source_path]
              entry["git_blob_sha1"] = source_blob
              entry["sha256"] = sha256
              entry["size_bytes"] = size
              entry["legacy_path"] = str(legacy_path)
              entry["byte_identical_copy_verified"] = True

              sums.append(f"{sha256}  {legacy_path}")
              receipt_files.append({
                  "source_path": source_path,
                  "legacy_path": str(legacy_path),
                  "git_blob_sha1": source_blob,
                  "sha256": sha256,
                  "size_bytes": size,
                  "byte_identical": True,
              })

          manifest["integrity"]["raw_sha256_manifest_required_before_legacy_relocation"] = False
          manifest["integrity"]["raw_sha256_algorithm"] = "SHA-256"
          manifest["integrity"]["legacy_copy_method"] = "git show SOURCE_COMMIT:path followed by git hash-object equality check"
          manifest["legacy_copy_verified"] = True
          manifest["original_files_modified"] = False
          manifest["next_required_action"] = "Audit every legacy framework and extract mechanisms into typed module manifests without editing the byte-identical legacy copies."
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          pathlib.Path("LEGACY_SHA256SUMS.txt").write_text("\n".join(sums) + "\n", encoding="utf-8")

          receipt = {
              "schema_version": "1.0.0",
              "project": "PROMPTS V2 — GAUNTLET AGENT OS",
              "checkpoint": "PROMPTS_V2_CHECKPOINT_0002",
              "state": "LEGACY_CORPUS_BYTE_FROZEN",
              "source_commit": source_commit,
              "revival_branch": os.environ["REVIVAL_BRANCH"],
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "workflow_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "files": receipt_files,
              "file_count": len(receipt_files),
              "all_byte_identical": all(item["byte_identical"] for item in receipt_files),
              "original_files_modified": False,
              "next_required_action": manifest["next_required_action"],
          }
          pathlib.Path("LEGACY_FREEZE_RECEIPT.json").write_text(
              json.dumps(receipt, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify allowed change set
        run: |
          set -euo pipefail
          changed="$(git status --short | awk '{print $2}')"
          printf '%s\n' "$changed"
          disallowed="$(printf '%s\n' "$changed" | grep -Ev '^(legacy/|LEGACY_MANIFEST\.json$|LEGACY_SHA256SUMS\.txt$|LEGACY_FREEZE_RECEIPT\.json$)' || true)"
          if [ -n "$disallowed" ]; then
            echo "Disallowed paths changed:"
            echo "$disallowed"
            exit 1
          fi

      - name: Commit verified freeze artifacts
        run: |
          set -euo pipefail
          git config user.name "prompts-v2-freeze-bot"
          git config user.email "actions@users.noreply.github.com"
          git add legacy LEGACY_MANIFEST.json LEGACY_SHA256SUMS.txt LEGACY_FREEZE_RECEIPT.json
          git commit -m "Freeze byte-identical legacy corpus with SHA-256 manifest"
          git push origin HEAD:revival/prompts-v2
