name: PROMPTS v2 kernel tests

on:
  push:
    branches:
      - revival/prompts-v2
      - main
    paths:
      - promptctl/**
      - tests/**
      - modules/legacy-extracted/MODULE_CATALOG.json
      - RULE_GRAPH.json
      - pyproject.toml
      - .github/workflows/kernel-tests.yml
  pull_request:
    paths:
      - promptctl/**
      - tests/**
      - modules/legacy-extracted/MODULE_CATALOG.json
      - RULE_GRAPH.json
      - pyproject.toml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate repository kernel
        run: python -m promptctl --root . validate
      - name: Run adversarial unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify deterministic selection
        run: |
          python -m promptctl --root . explain --task-type research > /tmp/selection-a.json
          python -m promptctl --root . explain --task-type research > /tmp/selection-b.json
          cmp /tmp/selection-a.json /tmp/selection-b.json
      - name: Verify composition excludes quarantined tail
        run: |
          python -m promptctl --root . compose --task-type research --goal "Audit the evidence." > /tmp/composed.md
          if grep -Fq "Sure, I can help you with that" /tmp/composed.md; then
            echo "Quarantined legacy content entered composed prompt"
            exit 1
          fi
