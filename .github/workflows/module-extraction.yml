## Governing extraction rule

The legacy files are historical evidence, not executable authority. A mechanism is retained only after separating it from platform syntax, rhetorical framing, fixed thresholds, illustrative claims and contaminated generated text.

## File rulings

| Legacy file | Retained mechanisms | Reclassified or excluded material | Ruling |
|---|---|---|---|
| `README.md` | Repository map and historical purpose | Status claims and licence declaration are not implementation evidence | Overview only |
| `COMPARE_ALPHA v1.md` | Cross-domain alignment; mismatch ledger; incentive autopsy | Canada examples and causal interpretations require independent evidence | Retain methods; quarantine examples |
| `CRIME_ALPHA v1.md` | Independent proxy triangulation; claim-strength ceiling; reporting-lag checks | Fixed crisis weights, fixed sample thresholds, undercount ranges and claims that selected proxies cannot be manipulated | Retain bounded methods; quarantine assertions |
| `GEOPOL_ALPHA v1.md` | Physical-data checks; regime-change awareness; definition-drift and rumor-overweighting checks | Fixed numerical rules, event returns, pass-through figures, universal thresholds and trailing assistant-response contamination | Retain methods; quarantine numbers and contaminated tail |
| `GROK_APEX_4.4.md` | Success lock; falsification; metric integrity; scope lock; evidence-language alignment; gates; monitors; secure defaults | Mandatory GPU utilization, universal seed counts, platform commands and blanket production rules become profile-specific | Primary governance source |
| `GROK_PROMPTING_GUIDE.md` | Goal clarity; output specification; justified tool use; iterative decomposition | Tool counts, knowledge-cutoff claims, speed gains and model comparisons are time-sensitive and unsupported | Retain adapter-neutral prompting method |
| `KLEON_CREATIVE_LAYER_v1.1.md` | Influence map; contrarian search; forced remix; simplest version; side-project validator; transformation ladder | Grok commands are adapter syntax; routines and score thresholds are optional; Austin Kleon attribution remains mandatory | Retain creative modules with attribution |
| `META_SCIENCE_INVESTIGATION_v1.1.md` | Investigate-before-dismiss; evidence-for/evidence-against ledger; incentive hypotheses; open-question framing | Darkness scores, UAP counts, exemplar conclusions and presumed suppression are not imported as facts | Retain curiosity method; quarantine advocacy assumptions |
| `THE ALPHA SUITE v1.0.md` | Umbrella map of proxy, regime and deflation concepts | Duplicated domain claims and numerical examples | Archive as provenance; modules derive from underlying files |
| `VAL_FRAMEWORK.md` | Phased workflow; progress discipline; optional sustainability checks | Python/Rust language lock, fixed launch deadlines, coverage targets and vibe thresholds are profile-specific | Retain workflow concepts; remove universal mandates |

## Contamination and integrity findings

1. `GEOPOL_ALPHA v1.md` contains a trailing assistant-style response beginning with language equivalent to “Sure, I can help you with that.” It remains preserved in `legacy/` but is excluded from every active module.
2. The root README declares MIT licensing, but the frozen corpus contains no root `LICENSE` file. PROMPTS v2 must add an actual licence file before release.
3. Several files embed current-event examples and precise numerical claims without source ledgers. Those examples are historical material, not trusted module rules.
4. Platform names, tool counts and model comparisons are adapters or dated observations, never kernel invariants.
5. Git blob identity and SHA-256 checks prove preservation, not factual correctness.

## Cross-framework conflicts requiring the next phase

| Conflict | Required resolution |
|---|---|
| Fixed `P(Crisis) > 0.65` versus general regime detection | Threshold becomes preregistered, task-specific configuration |
| `N >= 200` and DSR everywhere versus metric integrity | Deflation method must match the statistical construct |
| Mandatory GPU use versus task appropriateness | Hardware rules move to compute profiles |
| Python prototype / Rust production lock versus model independence | Language selection moves to task packs |
| Daily shipping and speed goals versus mechanical completion | Speed is subordinate to locked completion gates |
| Vibe score versus scope lock | Vibe may propose cadence changes but cannot authorize new work |
| “Official statistics lie” framing versus evidence neutrality | All sources receive explicit authority and failure analysis |
| Tool-specific Grok commands versus portable kernel | Commands move to adapters |
| Creative copying versus attribution and licensing | Practice copying is separated from publishable transformation |

## Extraction result

Twenty-four typed modules were generated and validated against `schemas/module.schema.json`. No legacy file was changed. Active modules preserve the strongest transferable mechanisms while profile-specific methods remain opt-in and unsupported factual material remains quarantined.

## Next required action

Build `RULE_GRAPH.json`, `CONFLICT_LEDGER.md`, `PRECEDENCE_POLICY.yaml` and `DEPRECATION_LEDGER.md`. The next phase must define deterministic precedence when modules conflict; it must not add new frameworks.
'''
