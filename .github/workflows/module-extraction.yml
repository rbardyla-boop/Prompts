          audit = '''# Legacy Mechanism Audit

## Checkpoint

- Project: **PROMPTS V2 — GAUNTLET AGENT OS**
- State: `LEGACY_MECHANISMS_TYPED`
- Source checkpoint: `PROMPTS_V2_CHECKPOINT_0002`
- Generated checkpoint: `PROMPTS_V2_CHECKPOINT_0003`
