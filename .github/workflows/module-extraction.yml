name: Extract typed legacy modules

on:
  push:
    branches:
      - revival/prompts-v2
    paths:
      - .github/workflows/module-extraction.yml

permissions:
  contents: write

concurrency:
  group: prompts-v2-module-extraction
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: revival/prompts-v2

      - name: Verify frozen corpus
        run: |
          set -euo pipefail
          sha256sum -c LEGACY_SHA256SUMS.txt
          git diff --exit-code -- legacy

      - name: Generate typed module manifests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections
          import hashlib
          import json
          from pathlib import Path

          out = Path("modules/legacy-extracted")
          out.mkdir(parents=True, exist_ok=True)

          sources = {
            "APEX": ("legacy/GROK_APEX_4.4.md", "80be44ad2eaf3e59d88523a08e65f4923567ec2b802a13b26f93ee3bdb040f39"),
            "VAL": ("legacy/VAL_FRAMEWORK.md", "b1c649536006764592fd865cb79daeb3e3c2e0a767706d09afe709d9395c2b1a"),
            "KLEON": ("legacy/KLEON_CREATIVE_LAYER_v1.1.md", "e5b9b501f8f2d918457151ce8390a2708007e61f04d0535cd9e132d16abdb4fd"),
            "META": ("legacy/META_SCIENCE_INVESTIGATION_v1.1.md", "d174447743e7ad906063c69ff7728cb96a4962438d5954294a101a0b12a49a70"),
            "CRIME": ("legacy/CRIME_ALPHA v1.md", "c7b320a08d38aa29d5c341953b9856cad23c5ff594e0a47c99c8999dfdef859e"),
            "GEOPOL": ("legacy/GEOPOL_ALPHA v1.md", "e383bf8754cb41667a4e0ad84cfbb63dfab04528ebbf8ed7601fda0b2a41debf"),
            "COMPARE": ("legacy/COMPARE_ALPHA v1.md", "cf5af7436c99fe051d15ac82fa4658800e79ce7b9b4c78d19922e5ee43a65c51"),
            "ALPHA": ("legacy/THE ALPHA SUITE v1.0.md", "e25a3aa4a3c0d4359c7531e523c12507626d7871e1a109fdbf0f9bb209b1ee9a"),
            "GUIDE": ("legacy/GROK_PROMPTING_GUIDE.md", "b564800b60069a8c10520bcb82b5c0b8b4efbe3e1c1f8866773536b628933e1f")
          }

          def ref(key, section):
            path, digest = sources[key]
            return {"path": path, "sha256": digest, "sections": [section]}

          def mod(mid, title, classification, status, refs, purpose, applies, excludes,
                  rules, checks, failures, default=False, cost="MEDIUM", claims=None,
                  parameters=None, conflicts=None, dependencies=None, notes=None):
            return {
              "module_id": mid,
              "version": "2.0.0",
              "title": title,
              "classification": classification,
              "status": status,
              "source_refs": refs,
              "purpose": purpose,
              "applies_to": applies,
              "does_not_apply_to": excludes,
              "inputs": ["task context"],
              "outputs": ["module decision and evidence"],
              "context_cost": cost,
              "default_include": default,
              "required_tools": [],
              "required_evidence": [],
              "dependencies": dependencies or [],
              "conflicts": conflicts or [],
              "hard_rules": rules,
              "configurable_parameters": parameters or {},
              "checks": checks,
              "failure_conditions": failures,
              "legacy_claims_not_imported": claims or [],
              "notes": notes or []
            }

          modules = [
            mod("governance.success-criteria-lock", "Success Criteria Lock", "INVARIANT", "ACTIVE", [ref("APEX", "HR-R2 and G1")], "Freeze observable success and invalidating failures before work begins.", ["research", "software", "benchmarking", "writing"], ["casual conversation"], ["Criteria are locked before results.", "Workers cannot weaken them silently."], ["Criteria are testable.", "Amendments are recorded."], ["Post-hoc criteria.", "Worker self-grading only."], True, "LOW"),
            mod("governance.scope-amendment-lock", "Scope and Amendment Lock", "INVARIANT", "ACTIVE", [ref("APEX", "HR-R6 and M3"), ref("VAL", "Scope Creep Protocol")], "Prevent silent scope changes while permitting explicit authorized amendments.", ["long-running projects", "research", "software"], ["small atomic tasks"], ["Material changes require authorization.", "Weaker gates cannot auto-approve."], ["Original contract remains recoverable."], ["Unrecorded scope drift.", "Unauthorized permission growth."], True, "LOW"),
            mod("evidence.falsification-check", "Material Falsification Check", "INVARIANT", "ACTIVE", [ref("APEX", "HR-R3"), ref("META", "Falsification Gap")], "Require a serious attempt to disprove empirical or performance claims.", ["empirical research", "benchmarking", "causal analysis"], ["translation", "pure fiction"], ["Execute at least one material falsifier."], ["The falsifier could change the conclusion."], ["Success without falsification.", "Only trivial tests."], True),
            mod("evidence.metric-integrity", "Metric Integrity Audit", "INVARIANT", "ACTIVE", [ref("APEX", "HR-R5 and M4")], "Verify that metrics measure the intended construct and resist shortcut wins.", ["benchmarking", "evaluation", "optimization"], ["tasks without metrics"], ["Expose proxy relationships and blind spots."], ["Run a shortcut audit."], ["Metric improves while objective does not."], True),
            mod("evidence.evidence-language-alignment", "Evidence-Language Alignment", "INVARIANT", "ACTIVE", [ref("APEX", "HR-R7"), ref("CRIME", "HR-CR3")], "Constrain factual wording to evidence authority, replication and completeness.", ["research", "reporting", "factual writing"], ["fiction"], ["No claim exceeds its weakest load-bearing evidence."], ["Major claims carry evidence grades."], ["Established language for preliminary evidence."], True, "LOW", ["Fixed seed counts are not universal."], {"evidence_scale": "task-pack-defined"}),
            mod("evidence.proxy-triangulation", "Independent Proxy Triangulation", "DOMAIN_METHOD", "ACTIVE", [ref("ALPHA", "Physical Grounding"), ref("CRIME", "Physical Grounding"), ref("GEOPOL", "Physical Grounding")], "Compare measurements with independent sources having different incentives and failure modes.", ["public-data research", "policy analysis", "measurement risk"], ["domains without meaningful proxies"], ["Evaluate every source rather than presuming truth or falsity.", "Justify proxy validity."], ["Compare at least two source families."], ["Preferred proxy treated as ground truth.", "Divergence automatically means deception."], False, "HIGH", ["Headlines always lie.", "Physical proxies cannot be manipulated.", "Official statistics are political artifacts first."]),
            mod("evidence.regime-change-gating", "Regime Change Detection and Gating", "DOMAIN_METHOD", "PROFILE_SPECIFIC", [ref("ALPHA", "Regime Gating"), ref("CRIME", "Regime Gating"), ref("GEOPOL", "Regime Gating")], "Detect structural changes before applying models learned under another regime.", ["time-series research", "policy shock analysis"], ["static tasks", "insufficient samples"], ["Preregister or sensitivity-test thresholds.", "No post-hoc gate tuning."], ["Retain a no-regime baseline."], ["Fixed legacy threshold imported universally."], False, "HIGH", ["P(Crisis) > 0.65 is not universal.", "Legacy source weights are not universal."], {"decision_threshold": "preregistered"}),
            mod("evidence.multiple-testing-deflation", "Multiple-Testing Deflation", "DOMAIN_METHOD", "PROFILE_SPECIFIC", [ref("ALPHA", "Deflation Discipline"), ref("CRIME", "HR-CR2"), ref("GEOPOL", "Deflation Discipline")], "Correct selected performance claims for repeated search using a metric-appropriate method.", ["quantitative strategy research", "large model searches"], ["ordinary factual claims", "small qualitative studies"], ["Match correction to the statistical construct.", "Count or bound all tried configurations."], ["Report raw and adjusted results."], ["DSR applied mechanically to unrelated metrics.", "Trial count understated."], False, "HIGH", ["N >= 200 is not universal.", "Legacy DSR values are illustrative."], {"correction_method": "task-appropriate"}),
            mod("evidence.cross-domain-alignment", "Cross-Domain Alignment", "DOMAIN_METHOD", "ACTIVE", [ref("COMPARE", "Core Pillars and Workflow")], "Align geography, time, definitions and units before cross-domain comparison.", ["cross-domain research", "multi-dataset synthesis"], ["single-source summary"], ["No inference before alignment checks."], ["Reconcile time, geography, units and definitions."], ["Correlation on mismatched windows."], False, "HIGH"),
            mod("evidence.incentive-autopsy", "Incentive Autopsy", "HEURISTIC", "ACTIVE", [ref("COMPARE", "Incentive Autopsy"), ref("META", "Authority Inversion")], "Map incentives as hypotheses without treating motive as proof.", ["institutional analysis", "source criticism"], ["tasks where incentives are irrelevant"], ["Include benign and adverse explanations.", "Mark observed versus inferred motives."], ["Separate direct evidence from structural incentives."], ["Beneficiary assumed causal.", "Disagreement treated as corruption."], False, "MEDIUM", ["Institutional divergence is not automatically narrative laundering."]),
            mod("evidence.explainability-audit", "Feature Contribution Audit", "DOMAIN_METHOD", "PROFILE_SPECIFIC", [ref("CRIME", "SHAP Audit"), ref("GEOPOL", "SHAP Audit"), ref("COMPARE", "SHAP Audit")], "Inspect feature contributions for leakage and shortcuts without claiming causality.", ["predictive models", "ranking models"], ["systems without feature predictions"], ["Explainability is diagnostic, not causal proof."], ["Review dominant features and ablate when feasible."], ["SHAP treated as causal.", "Expected signs forced."], False, "HIGH", ["Legacy target signs and magnitudes are not imported."]),
            mod("research.curiosity-lens", "Curiosity Lens", "HEURISTIC", "ACTIVE", [ref("META", "Curiosity Lens and Case Study")], "Separate evidence for, evidence against, unknowns and missing tests on disputed claims.", ["exploratory research", "disputed claims"], ["advocacy-only requests"], ["Investigate before endorsing or dismissing.", "Lack of investigation is not positive evidence."], ["Represent evidence for and against."], ["Suppression is presupposed.", "Absence of evidence becomes evidence."], False, "MEDIUM", ["Legacy darkness scores and UAP counts are not imported."]),
            mod("research.competing-view-search", "Competing View Search", "HEURISTIC", "ACTIVE", [ref("KLEON", "Contrarian Check"), ref("META", "Curiosity Lens")], "Seek the strongest relevant disagreement before committing to a frame.", ["research", "architecture", "policy analysis"], ["simple deterministic tasks"], ["Seek material disagreement rather than performative balance."], ["Represent one credible competing account fairly."], ["Select only weak opponents.", "Contrarian status substitutes for evidence."]),
            mod("prompting.goal-format-tool-clarity", "Goal, Format and Tool Clarity", "TOOL_ADAPTER", "ACTIVE", [ref("GUIDE", "Key Principles and Step-by-Step Guide")], "Normalize a task into an objective, constraints, output form and justified tool plan.", ["model-mediated tasks"], [], ["Select tools because needed, not because a legacy platform named them."], ["Objective and deliverable are explicit."], ["Platform syntax leaks into kernel.", "Tools are forced unnecessarily."], True, "LOW", ["Legacy tool counts, cutoff claims, speed gains and model comparisons are dated."]),
            mod("creative.influence-map", "Influence Map", "HEURISTIC", "ACTIVE", [ref("KLEON", "Part 1 Influence Map")], "Make influences explicit and expose common patterns and echo chambers.", ["creative work", "research direction", "product design"], ["routine factual lookup"], ["Name borrowed mechanisms.", "Influence is not authority."], ["Record attribution and consider opposing influences."], ["Copy without transformation."], False, "MEDIUM", notes=["Preserve Austin Kleon attribution."]),
            mod("creative.forced-remix", "Forced Cross-Domain Remix", "HEURISTIC", "ACTIVE", [ref("KLEON", "Part 2 Remix Generator")], "Generate materially different mechanisms through unrelated domains and a simplest-version test.", ["creative design", "architecture", "stuck problems"], ["frozen validation"], ["At least one candidate changes the mechanism."], ["Candidates are testable and name a first experiment."], ["Metaphor mistaken for implementation.", "Scope expands without a gate."]),
            mod("creative.side-project-validator", "Side-Project Validator", "HEURISTIC", "ACTIVE", [ref("KLEON", "Part 4 Side Project Validator"), ref("VAL", "Vibe Check")], "Prevent new ideas from displacing active work without an opportunity-cost decision.", ["personal projects", "research portfolios"], ["mandatory safety repair"], ["Active scope lock has priority.", "Excitement cannot waive terminal obligations."], ["Name displaced work and a revisit trigger."], ["A new project begins without closing the current contract.", "Vibe alone authorizes work."], False, "LOW", ["Fixed score thresholds are not universal."], {"timebox": "task-pack-defined"}, ["governance.scope-amendment-lock"]),
            mod("creative.transform-with-attribution", "Transform With Attribution", "HEURISTIC", "ACTIVE", [ref("KLEON", "Part 6 Steal and Transform")], "Separate learning copies from publishable transformation and preserve attribution.", ["creative writing", "design", "framework development"], ["unlicensed verbatim reproduction"], ["Practice copies are not shipped as original.", "Material influence is disclosed."], ["Add distinct mechanism, context or expression and check licence."], ["Cosmetic edits called transformation.", "Attribution removed."], False, "MEDIUM", notes=["Preserve Austin Kleon attribution and applicable licence obligations."]),
            mod("development.secure-defaults", "Secure Development Defaults", "INVARIANT", "ACTIVE", [ref("APEX", "HR-D2")], "Prevent secret, injection, validation and error-handling failures in generated software.", ["software development", "automation"], ["non-code tasks"], ["Do not hard-code secrets.", "Validate inputs.", "Avoid unsafe command or query concatenation."], ["Secret scan and negative-input tests pass."], ["Credentials enter source or trace.", "Untrusted input reaches an interpreter unsafely."], True, "LOW"),
            mod("development.resilience-and-test-baseline", "Resilience and Test Baseline", "CONFIGURABLE_POLICY", "ACTIVE", [ref("APEX", "HR-D3 and HR-D4")], "Require bounded failure handling and executable tests proportionate to risk.", ["software development", "tool integrations"], ["static documents"], ["External calls are bounded.", "Retries are bounded and idempotency-aware."], ["Execute main and error-path tests."], ["Unbounded retries.", "Blanket patterns where irrelevant."], True, "MEDIUM", ["One test per public function is not universal."], {"retry_limit": "risk-profile-defined"}),
            mod("workflow.minimum-viable-experiment", "Minimum Viable Experiment", "HEURISTIC", "ACTIVE", [ref("APEX", "SR-1 and G3"), ref("VAL", "7-Phase Workflow")], "Test the core mechanism cheaply before full resources or polish.", ["research", "software", "product design"], ["final sealed evaluation"], ["The experiment must be able to falsify the mechanism."], ["Execute a sanity test and define scale-up criteria."], ["A polished demo substitutes for a mechanism test.", "The MVE becomes permanent."], False, "LOW"),
            mod("monitoring.scope-progress-claim", "Scope, Progress and Claim Monitor", "CONFIGURABLE_POLICY", "ACTIVE", [ref("APEX", "M2, M3 and M4")], "Detect no-progress loops, scope drift and claims outrunning evidence.", ["long-running agents", "multi-phase projects"], ["single-response tasks"], ["Measure progress by external state change.", "Warnings trigger repair, replan or stop."], ["Record budgets, state deltas and claim checks."], ["Narrated progress without artifact change.", "Warnings have no enforcement."], True, "LOW", parameters={"no_progress_window": "task-pack-defined"}),
            mod("workflow.gated-phase-control", "Gated Phase Control", "CONFIGURABLE_POLICY", "ACTIVE", [ref("APEX", "G1-G5"), ref("VAL", "7-Phase Workflow")], "Move work through explicit phases with independently checkable exits.", ["long-running projects", "research", "software", "publication"], ["small atomic tasks"], ["A phase cannot close while a required gate is false.", "Gate evidence lives outside conversation."], ["Each phase has entry and exit checks."], ["Worker advances state by assertion.", "Documentation is confused with completion."], True, dependencies=["governance.success-criteria-lock"]),
            mod("workflow.vibe-and-sustainability", "Vibe and Sustainability Check", "HEURISTIC", "PROFILE_SPECIFIC", [ref("VAL", "Core Pillars and Vibe Check"), ref("KLEON", "Creative Routine Builder")], "Track motivation and routine without allowing mood scores to waive evidence or safety gates.", ["personal creative work", "long-running solo projects"], ["safety approval", "terminal completion"], ["Vibe informs scheduling only.", "Terminal success remains evidence-based."], ["Change workload or cadence, not truth criteria."], ["Score directly validates or kills a project.", "Vibe presented as objective."], False, "LOW", ["Fixed thresholds and universal creation ratios are not imported."], {"cadence": "user-defined"}, ["governance.success-criteria-lock"])
          ]

          required = {
            "module_id", "version", "title", "classification", "status", "source_refs",
            "purpose", "applies_to", "does_not_apply_to", "inputs", "outputs",
            "context_cost", "default_include", "hard_rules", "checks", "failure_conditions"
          }
          ids = set()
          entries = []
          for item in modules:
            missing = required - item.keys()
            if missing:
              raise SystemExit(f"{item['module_id']} missing {sorted(missing)}")
            if item["module_id"] in ids:
              raise SystemExit(f"duplicate module id {item['module_id']}")
            ids.add(item["module_id"])
            path = out / (item["module_id"].replace(".", "__") + ".module.json")
            payload = json.dumps(item, indent=2, ensure_ascii=False) + "\n"
            path.write_text(payload, encoding="utf-8")
            entries.append({
              "module_id": item["module_id"],
              "path": str(path),
              "sha256": hashlib.sha256(payload.encode()).hexdigest(),
              "classification": item["classification"],
              "status": item["status"],
              "default_include": item["default_include"]
            })

          if len(modules) != 24:
            raise SystemExit(f"expected 24 modules, found {len(modules)}")

          index = {
            "schema_version": "1.0.0",
            "catalog_id": "prompts-v2.legacy-extracted",
            "checkpoint": "PROMPTS_V2_CHECKPOINT_0003",
            "source_checkpoint": "PROMPTS_V2_CHECKPOINT_0002",
            "module_schema": "schemas/module.schema.json",
            "module_count": len(modules),
            "counts_by_classification": dict(collections.Counter(x["classification"] for x in modules)),
            "counts_by_status": dict(collections.Counter(x["status"] for x in modules)),
            "modules": sorted(entries, key=lambda x: x["module_id"]),
            "legacy_files_modified": False,
            "validation": {"required_fields": "PASS", "unique_ids": "PASS", "module_count": "PASS"},
            "next_required_action": "Build rule graph, conflict ledger, precedence policy and deprecation ledger."
          }
          index_payload = json.dumps(index, indent=2, ensure_ascii=False) + "\n"
          (out / "MODULE_INDEX.json").write_text(index_payload, encoding="utf-8")

          audit = """# Legacy Mechanism Audit

## Result

- Checkpoint: `PROMPTS_V2_CHECKPOINT_0003`
- State: `LEGACY_MECHANISMS_TYPED`
- Frozen legacy files modified: **No**
- Typed modules: **24**

The frozen files are historical evidence, not executable authority. Transferable mechanisms were separated from fixed thresholds, platform syntax, rhetorical framing, unsupported examples and contaminated generated text.

## Principal rulings

- APEX governance locks, falsification, metrics, gates, monitors and secure defaults were retained.
- Mandatory GPU use, universal seed counts and blanket production rules became profiles rather than invariants.
- Alpha proxy triangulation, regime awareness and multiple-testing discipline were retained as bounded methods; legacy numerical thresholds and unsourced examples were not imported.
- COMPARE alignment and incentive analysis were retained, but incentive hypotheses cannot establish causation.
- Meta-Science curiosity methods were retained; darkness scores, UAP counts and presumed suppression were quarantined.
- Kleon influence, remix and transformation methods were retained with attribution; Grok commands became adapter concerns.
- VAL workflow and sustainability concepts were retained; language locks, deadlines, coverage targets and vibe thresholds were not made universal.
- The Grok guide contributed model-neutral goal, output and tool clarity; dated model comparisons and tool claims were excluded.

## Integrity findings

1. `legacy/GEOPOL_ALPHA v1.md` contains a trailing assistant-style response beginning “Sure, I can help you with that.” It remains preserved but is excluded from active modules.
2. The frozen source declares MIT in the README but contains no root `LICENSE` file. A licence file remains a release gate.
3. Git and SHA-256 identity prove preservation, not factual correctness.

## Next action

Build `RULE_GRAPH.json`, `CONFLICT_LEDGER.md`, `PRECEDENCE_POLICY.yaml` and `DEPRECATION_LEDGER.md`. No new framework is authorized.
"""
          Path("LEGACY_MECHANISM_AUDIT.md").write_text(audit, encoding="utf-8")

          checkpoint = {
            "schema_version": "1.0.0",
            "project": "PROMPTS V2 — GAUNTLET AGENT OS",
            "checkpoint": "PROMPTS_V2_CHECKPOINT_0003",
            "state": "LEGACY_MECHANISMS_TYPED",
            "source_checkpoint": "PROMPTS_V2_CHECKPOINT_0002",
            "module_count": 24,
            "module_index_sha256": hashlib.sha256(index_payload.encode()).hexdigest(),
            "audit_sha256": hashlib.sha256(audit.encode()).hexdigest(),
            "legacy_files_modified": False,
            "validation": {"required_fields": "PASS", "unique_module_ids": "PASS", "module_count": "PASS"},
            "known_contamination_quarantined": ["legacy/GEOPOL_ALPHA v1.md trailing assistant response"],
            "next_required_action": index["next_required_action"]
          }
          Path("PROMPTS_V2_CHECKPOINT_0003.json").write_text(json.dumps(checkpoint, indent=2) + "\n")
          PY

      - name: Verify generated artifacts
        run: |
          set -euo pipefail
          test "$(find modules/legacy-extracted -name '*.module.json' | wc -l)" -eq 24
          python3 -m json.tool modules/legacy-extracted/MODULE_INDEX.json >/dev/null
          python3 -m json.tool PROMPTS_V2_CHECKPOINT_0003.json >/dev/null
          sha256sum -c LEGACY_SHA256SUMS.txt
          git diff --exit-code -- legacy

      - name: Commit checkpoint 0003
        run: |
          set -euo pipefail
          git config user.name "prompts-v2-module-bot"
          git config user.email "actions@users.noreply.github.com"
          git add modules/legacy-extracted LEGACY_MECHANISM_AUDIT.md PROMPTS_V2_CHECKPOINT_0003.json
          git commit -m "Extract typed modules from frozen legacy prompts"
          git push origin HEAD:revival/prompts-v2
