name: Extract typed legacy modules

on:
  push:
    branches:
      - revival/prompts-v2
    paths:
      - .github/workflows/module-extraction.yml

permissions:
  contents: write

concurrency:
  group: prompts-v2-module-extraction
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out revival branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: revival/prompts-v2

      - name: Verify frozen legacy bytes
        run: |
          set -euo pipefail
          sha256sum -c LEGACY_SHA256SUMS.txt
          git diff --exit-code -- legacy

      - name: Install schema validator
        run: python3 -m pip install --disable-pip-version-check jsonschema

      - name: Generate module manifests and audit
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections
          import hashlib
          import json
          import os
          import pathlib
          from jsonschema import Draft202012Validator

          ROOT = pathlib.Path('.')
          OUT = ROOT / 'modules' / 'legacy-extracted'
          OUT.mkdir(parents=True, exist_ok=True)

          SHA = {
              'README': '5d96a585b19b3ffeb992f8e94b589097f05c0f87865be8405c0e737d32e2ba33',
              'COMPARE': 'cf5af7436c99fe051d15ac82fa4658800e79ce7b9b4c78d19922e5ee43a65c51',
              'CRIME': 'c7b320a08d38aa29d5c341953b9856cad23c5ff594e0a47c99c8999dfdef859e',
              'GEOPOL': 'e383bf8754cb41667a4e0ad84cfbb63dfab04528ebbf8ed7601fda0b2a41debf',
              'APEX': '80be44ad2eaf3e59d88523a08e65f4923567ec2b802a13b26f93ee3bdb040f39',
              'GUIDE': 'b564800b60069a8c10520bcb82b5c0b8b4efbe3e1c1f8866773536b628933e1f',
              'KLEON': 'e5b9b501f8f2d918457151ce8390a2708007e61f04d0535cd9e132d16abdb4fd',
              'META': 'd174447743e7ad906063c69ff7728cb96a4962438d5954294a101a0b12a49a70',
              'ALPHA': 'e25a3aa4a3c0d4359c7531e523c12507626d7871e1a109fdbf0f9bb209b1ee9a',
              'VAL': 'b1c649536006764592fd865cb79daeb3e3c2e0a767706d09afe709d9395c2b1a',
          }

          PATHS = {
              'README': 'legacy/README.md',
              'COMPARE': 'legacy/COMPARE_ALPHA v1.md',
              'CRIME': 'legacy/CRIME_ALPHA v1.md',
              'GEOPOL': 'legacy/GEOPOL_ALPHA v1.md',
              'APEX': 'legacy/GROK_APEX_4.4.md',
              'GUIDE': 'legacy/GROK_PROMPTING_GUIDE.md',
              'KLEON': 'legacy/KLEON_CREATIVE_LAYER_v1.1.md',
              'META': 'legacy/META_SCIENCE_INVESTIGATION_v1.1.md',
              'ALPHA': 'legacy/THE ALPHA SUITE v1.0.md',
              'VAL': 'legacy/VAL_FRAMEWORK.md',
          }

          def ref(key, *sections):
              return {'path': PATHS[key], 'sha256': SHA[key], 'sections': list(sections)}

          def module(module_id, title, classification, status, source_refs, purpose,
                     applies_to, does_not_apply_to, inputs, outputs, context_cost,
                     default_include, hard_rules, checks, failure_conditions,
                     required_tools=None, required_evidence=None, dependencies=None,
                     conflicts=None, configurable_parameters=None,
                     legacy_claims_not_imported=None, notes=None):
              return {
                  'module_id': module_id,
                  'version': '2.0.0',
                  'title': title,
                  'classification': classification,
                  'status': status,
                  'source_refs': source_refs,
                  'purpose': purpose,
                  'applies_to': applies_to,
                  'does_not_apply_to': does_not_apply_to,
                  'inputs': inputs,
                  'outputs': outputs,
                  'context_cost': context_cost,
                  'default_include': default_include,
                  'required_tools': required_tools or [],
                  'required_evidence': required_evidence or [],
                  'dependencies': dependencies or [],
                  'conflicts': conflicts or [],
                  'hard_rules': hard_rules,
                  'configurable_parameters': configurable_parameters or {},
                  'checks': checks,
                  'failure_conditions': failure_conditions,
                  'legacy_claims_not_imported': legacy_claims_not_imported or [],
                  'notes': notes or [],
              }

          modules = [
              module(
                  'governance.success-criteria-lock', 'Success Criteria Lock', 'INVARIANT', 'ACTIVE',
                  [ref('APEX', 'HR-R2 Success Criteria Lock', 'G1 Session Initialization Gate')],
                  'Define observable success and invalidating failures before implementation or experimentation begins.',
                  ['research', 'software', 'benchmarking', 'writing', 'creative-production'],
                  ['casual-conversation'], ['goal', 'deliverables', 'quality bar'],
                  ['locked success criteria', 'invalidating failures'], 'LOW', True,
                  ['Criteria are frozen before results are observed.', 'Workers cannot silently weaken criteria.'],
                  ['Criteria exist and are testable.', 'Any amendment has an explicit record.'],
                  ['Criteria are invented after seeing results.', 'Success is defined only by worker opinion.']
              ),
              module(
                  'governance.scope-amendment-lock', 'Scope and Amendment Lock', 'INVARIANT', 'ACTIVE',
                  [ref('APEX', 'HR-R6 Scope Lock', 'M3 Scope Monitor'), ref('VAL', 'Scope Creep Protocol')],
                  'Prevent silent scope expansion or contraction while permitting recorded, authorized amendments.',
                  ['long-running-projects', 'research', 'software', 'publication'],
                  ['one-shot-low-risk-tasks'], ['locked scope', 'amendment request'],
                  ['scope verdict', 'amendment record'], 'LOW', True,
                  ['Scope changes require classification and authorization.', 'A worker cannot auto-approve weaker gates or broader permissions.'],
                  ['Changed scope is visible in the decision ledger.', 'Original contract remains recoverable.'],
                  ['Unrecorded scope drift.', 'Budget or permission expansion without approval.']
              ),
              module(
                  'evidence.falsification-check', 'Material Falsification Check', 'INVARIANT', 'ACTIVE',
                  [ref('APEX', 'HR-R3 Falsification Mandate'), ref('META', 'Part 2 The Falsification Gap')],
                  'Require a serious attempt to disprove important empirical or performance claims before promotion.',
                  ['empirical-research', 'benchmarking', 'causal-analysis', 'performance-claims'],
                  ['translation', 'purely-creative-writing'], ['claim', 'evidence', 'candidate falsifiers'],
                  ['falsification result', 'surviving claim'], 'MEDIUM', True,
                  ['At least one material falsifier must be executed, not merely described.'],
                  ['Falsifier could have changed the conclusion.', 'Failure evidence is retained.'],
                  ['Success claim without attempted falsification.', 'Only trivial edge cases are tested.'],
                  required_evidence=['test output or source evidence']
              ),
              module(
                  'evidence.metric-integrity', 'Metric Integrity Audit', 'INVARIANT', 'ACTIVE',
                  [ref('APEX', 'HR-R5 Metric Integrity', 'M4 Claim Monitor')],
                  'Verify that a metric measures the intended construct and cannot be won through an irrelevant proxy.',
                  ['benchmarking', 'evaluation', 'optimization', 'research'],
                  ['tasks without quantitative metrics'], ['objective', 'metric', 'possible shortcuts'],
                  ['construct mapping', 'gaming risks', 'metric verdict'], 'MEDIUM', True,
                  ['Proxy relationships and known blind spots must be explicit.'],
                  ['A shortcut audit is performed.', 'Metric movement is compared with real outcome movement.'],
                  ['Metric improves while the actual objective does not.', 'Metric definition changes post hoc.']
              ),
              module(
                  'evidence.evidence-language-alignment', 'Evidence–Language Alignment', 'INVARIANT', 'ACTIVE',
                  [ref('APEX', 'HR-R7 Evidence-Language Alignment'), ref('CRIME', 'HR-CR3 Weakest Physical Grounding')],
                  'Constrain claim wording to the strength, authority, replication and completeness of available evidence.',
                  ['research', 'reporting', 'benchmarking', 'factual-writing'],
                  ['fiction'], ['claim', 'evidence grade', 'limitations'],
                  ['permitted wording', 'downgraded or rejected claim'], 'LOW', True,
                  ['No claim may be stronger than its weakest load-bearing evidence.'],
                  ['Every major claim has an evidence grade.', 'Limitations appear with the claim.'],
                  ['Established language is used for preliminary evidence.', 'Missing evidence is hidden.'],
                  configurable_parameters={'evidence_scale': 'task-pack-defined'},
                  legacy_claims_not_imported=['Fixed seed-count language is not universal; task packs set evidence thresholds.']
              ),
              module(
                  'evidence.proxy-triangulation', 'Independent Proxy Triangulation', 'DOMAIN_METHOD', 'ACTIVE',
                  [ref('ALPHA', 'Physical Grounding'), ref('CRIME', 'Core Pillars Physical Grounding'), ref('GEOPOL', 'Core Pillars Physical Grounding')],
                  'Test reported measurements against independent evidence streams with different incentives and failure modes.',
                  ['public-data-research', 'policy-analysis', 'operational-audit', 'measurement-risk'],
                  ['domains where no meaningful independent proxy exists'], ['target claim', 'primary measure', 'candidate proxies'],
                  ['triangulation table', 'agreement and divergence report'], 'HIGH', False,
                  ['Official and alternative sources are evaluated, not presumed truthful or false.', 'Proxy validity must be justified.'],
                  ['At least two source families are compared.', 'Known proxy confounders are recorded.'],
                  ['A preferred proxy is treated as ground truth without validation.', 'Disagreement is automatically interpreted as deception.'],
                  required_tools=['source retrieval'], required_evidence=['source provenance', 'measurement definitions'],
                  legacy_claims_not_imported=['Headlines lie; shipments do not.', 'Bodies, bullets and hospital data cannot be manipulated.', 'Official statistics are political artifacts first.']
              ),
              module(
                  'evidence.regime-change-gating', 'Regime Change Detection and Gating', 'DOMAIN_METHOD', 'PROFILE_SPECIFIC',
                  [ref('ALPHA', 'Regime Gating'), ref('CRIME', 'Regime Gating'), ref('GEOPOL', 'Regime Gating')],
                  'Detect structural changes before applying models or evidence weights learned under a different operating regime.',
                  ['time-series-research', 'markets', 'policy-shock-analysis', 'changing-rule-environments'],
                  ['static tasks', 'small samples without change-point support'], ['time series', 'candidate regimes', 'change evidence'],
                  ['regime probabilities', 'gating decision', 'sensitivity analysis'], 'HIGH', False,
                  ['Thresholds must be preregistered or sensitivity-tested.', 'Gating cannot be tuned after seeing target outcomes.'],
                  ['Alternative thresholds are reported.', 'No-regime baseline is retained.'],
                  ['A fixed threshold is imported as universal truth.', 'Regime labels merely restate the desired conclusion.'],
                  required_tools=['statistical analysis'], required_evidence=['time-indexed observations'],
                  configurable_parameters={'model_family': 'task-pack-defined', 'decision_threshold': 'preregistered'},
                  legacy_claims_not_imported=['P(Crisis) > 0.65 is not a universal threshold.', 'Fixed physical and official source weights are not universal.']
              ),
              module(
                  'evidence.multiple-testing-deflation', 'Multiple-Testing Deflation', 'DOMAIN_METHOD', 'PROFILE_SPECIFIC',
                  [ref('ALPHA', 'Deflation Discipline'), ref('CRIME', 'HR-CR2'), ref('GEOPOL', 'Deflation Discipline')],
                  'Correct performance claims for repeated search, model selection and non-normal outcomes using a method appropriate to the metric.',
                  ['quantitative-strategy-research', 'large-model-selection-searches', 'repeated-hypothesis-testing'],
                  ['ordinary factual claims', 'small qualitative studies without a Sharpe-like metric'],
                  ['raw metric', 'number of trials', 'selection procedure', 'distribution assumptions'],
                  ['adjusted metric', 'sensitivity table', 'overfit verdict'], 'HIGH', False,
                  ['The correction must match the statistical setting.', 'All tried configurations must be counted or bounded.'],
                  ['Raw and adjusted results are reported.', 'Assumptions are tested.'],
                  ['DSR is applied mechanically to unrelated statistics.', 'The number of trials is understated.'],
                  required_tools=['statistical calculation'],
                  configurable_parameters={'correction_method': 'DSR, FDR, family-wise or task-appropriate alternative'},
                  legacy_claims_not_imported=['N >= 200 is not a universal requirement.', 'Legacy example DSR and PSR values are illustrative, not validated results.']
              ),
              module(
                  'evidence.cross-domain-alignment', 'Cross-Domain Alignment', 'DOMAIN_METHOD', 'ACTIVE',
                  [ref('COMPARE', 'Core Pillars', 'Tactical 3-Phase Workflow')],
                  'Align geography, time, definitions and units before comparing signals from different domains.',
                  ['cross-domain-research', 'multi-dataset-synthesis', 'causal-investigation'],
                  ['single-source-summary'], ['datasets', 'geographies', 'time windows', 'definitions'],
                  ['alignment map', 'mismatch ledger', 'comparable subset'], 'HIGH', False,
                  ['No cross-domain inference before exact alignment is checked.'],
                  ['Time, geography, units and definitions are reconciled.', 'Unaligned records are excluded or qualified.'],
                  ['Correlation is computed on mismatched windows.', 'Geographic aggregation hides non-overlap.']
              ),
              module(
                  'evidence.incentive-autopsy', 'Incentive Autopsy', 'HEURISTIC', 'ACTIVE',
                  [ref('COMPARE', 'Incentive Autopsy'), ref('META', 'Authority Inversion', 'Incentive Analysis')],
                  'Map incentives that may explain reporting, selection or institutional behavior without treating motive as proof.',
                  ['institutional-analysis', 'source-criticism', 'policy-analysis'],
                  ['tasks where actor incentives are irrelevant'], ['actors', 'decisions', 'benefits', 'costs', 'evidence'],
                  ['incentive map', 'alternative explanations', 'evidentiary status'], 'MEDIUM', False,
                  ['Incentives generate hypotheses, not factual verdicts.', 'Competing benign and adverse explanations must be included.'],
                  ['Each motive claim is labeled as observed or inferred.', 'Direct evidence is separated from structural incentive.'],
                  ['A beneficiary is assumed to have caused the outcome.', 'Narrative disagreement is treated as corruption.'],
                  legacy_claims_not_imported=['Institutional divergence is not automatically narrative laundering or suppression.']
              ),
              module(
                  'evidence.explainability-audit', 'Feature Contribution Audit', 'DOMAIN_METHOD', 'PROFILE_SPECIFIC',
                  [ref('CRIME', 'SHAP Reality Audit'), ref('GEOPOL', 'SHAP Black-Box Audit'), ref('COMPARE', 'SHAP Audit')],
                  'Inspect which features drive a predictive result and whether those contributions match the intended construct.',
                  ['predictive-models', 'ranking-models', 'high-stakes-classifiers'],
                  ['systems without feature-based predictions'], ['model', 'features', 'predictions'],
                  ['contribution report', 'shortcut warning'], 'HIGH', False,
                  ['Explainability output is diagnostic, not causal proof.'],
                  ['Dominant features are reviewed for leakage and shortcut behavior.', 'Ablation is used when feasible.'],
                  ['SHAP values are treated as causal effects.', 'Expected signs are hard-coded to force agreement.'],
                  required_tools=['model inspection'],
                  legacy_claims_not_imported=['Legacy target contribution signs and magnitudes are not imported.']
              ),
              module(
                  'research.curiosity-lens', 'Curiosity Lens', 'HEURISTIC', 'ACTIVE',
                  [ref('META', 'Part 4 The Curiosity Lens', 'Case Study Template')],
                  'Investigate a disputed or dismissed claim by separating evidence for, evidence against, unknowns and missing tests.',
                  ['exploratory-research', 'disputed-claims', 'understudied-topics'],
                  ['requests for advocacy without investigation'], ['topic', 'official position', 'available evidence'],
                  ['balanced evidence ledger', 'open questions', 'next tests'], 'MEDIUM', False,
                  ['Investigate before endorsing or dismissing.', 'Absence of investigation is not evidence that a claim is true.'],
                  ['Evidence for and against is presented.', 'Source quality and replication are recorded.'],
                  ['The framework presupposes establishment suppression.', 'A lack of evidence is converted into positive evidence.'],
                  required_tools=['source retrieval'],
                  legacy_claims_not_imported=['Legacy darkness scores and UAP example counts are not imported as facts.']
              ),
              module(
                  'research.competing-view-search', 'Competing View Search', 'HEURISTIC', 'ACTIVE',
                  [ref('KLEON', 'Influence Map Contrarian Check'), ref('META', 'Curiosity Lens')],
                  'Seek the strongest relevant disagreement before committing to a research frame or design.',
                  ['research', 'architecture', 'policy-analysis', 'creative-direction'],
                  ['simple deterministic tasks'], ['current view', 'influences', 'decision'],
                  ['contrarian sources', 'steelman', 'changed assumptions'], 'MEDIUM', False,
                  ['Search for material disagreement, not performative balance.'],
                  ['At least one credible competing account is represented fairly.', 'The decision records whether it changed.'],
                  ['Only weak opponents are selected.', 'Contrarian status substitutes for evidence.']
              ),
              module(
                  'prompting.goal-format-tool-clarity', 'Goal, Format and Tool Clarity', 'TOOL_ADAPTER', 'ACTIVE',
                  [ref('GUIDE', 'Key Principles', 'Step-by-Step Guide')],
                  'Translate a task into an explicit objective, context, constraints, output form and justified tool plan.',
                  ['all model-mediated tasks'], ['none'], ['user goal', 'available context', 'tool inventory'],
                  ['normalized request', 'output contract', 'tool rationale'], 'LOW', True,
                  ['Tools are selected because they are needed, not because a legacy platform named them.', 'Output constraints remain subordinate to correctness.'],
                  ['Objective and deliverable are explicit.', 'Every tool call has a task reason.'],
                  ['Platform-specific commands leak into the kernel.', 'Tool use is forced when pure reasoning is sufficient.'],
                  legacy_claims_not_imported=['Legacy Grok tool counts, cutoff claims, speed gains and Grok-versus-Claude comparisons are time-sensitive and unverified.']
              ),
              module(
                  'creative.influence-map', 'Influence Map', 'HEURISTIC', 'ACTIVE',
                  [ref('KLEON', 'Part 1 The Influence Map')],
                  'Make creative and technical influences explicit, identify common patterns and expose echo chambers.',
                  ['creative-work', 'research-direction', 'product-design'],
                  ['routine factual lookup'], ['project', 'admired sources'],
                  ['influence map', 'common threads', 'gaps'], 'MEDIUM', False,
                  ['Sources and borrowed mechanisms are named.', 'Influence is not treated as authority.'],
                  ['Attribution is recorded.', 'At least one missing or opposing influence is considered.'],
                  ['Influences are copied without transformation.', 'The map becomes a popularity list.'],
                  notes=['Austin Kleon attribution must remain visible.']
              ),
              module(
                  'creative.forced-remix', 'Forced Cross-Domain Remix', 'HEURISTIC', 'ACTIVE',
                  [ref('KLEON', 'Part 2 The Remix Generator')],
                  'Generate materially different approaches by translating a problem through unrelated domains and a simplest-version test.',
                  ['creative-design', 'architecture', 'stuck-problems'],
                  ['late-stage frozen validation'], ['problem', 'constraints', 'candidate external domains'],
                  ['remix candidates', 'simplest viable experiment'], 'MEDIUM', False,
                  ['At least one candidate changes the mechanism, not merely vocabulary.', 'The simplest credible alternative is included.'],
                  ['Candidates are testable.', 'A first experiment is specified.'],
                  ['Metaphors are mistaken for implementations.', 'Remix expands scope without a gate.']
              ),
              module(
                  'creative.side-project-validator', 'Side-Project Validator', 'HEURISTIC', 'ACTIVE',
                  [ref('KLEON', 'Part 4 Side Project Validator'), ref('VAL', 'Vibe Check Protocol')],
                  'Prevent new ideas from displacing the active project without an explicit opportunity-cost and scope decision.',
                  ['personal-projects', 'research-portfolios', 'product-ideas'],
                  ['mandatory safety repair'], ['new idea', 'active project', 'available budget'],
                  ['START, DEFER or KILL verdict', 'minimum capture', 'revisit trigger'], 'LOW', False,
                  ['The active scope lock has priority.', 'Excitement cannot override terminal obligations.'],
                  ['Displaced work is named.', 'Deferred ideas receive no implementation resources.'],
                  ['A new project begins without closing or amending the current contract.', 'A vibe score alone authorizes work.'],
                  conflicts=['governance.scope-amendment-lock'],
                  configurable_parameters={'timebox': 'task-pack-defined'},
                  legacy_claims_not_imported=['Fixed score thresholds are not universal.']
              ),
              module(
                  'creative.transform-with-attribution', 'Transform With Attribution', 'HEURISTIC', 'ACTIVE',
                  [ref('KLEON', 'Part 6 Steal and Transform Framework')],
                  'Separate learning-by-copying from publishable transformation and preserve source attribution.',
                  ['creative-writing', 'design', 'framework-development'],
                  ['verbatim reproduction without permission'], ['source', 'borrowed element', 'new context'],
                  ['transformation record', 'attribution note', 'original artifact'], 'MEDIUM', False,
                  ['Practice copies are not shipped as original work.', 'Material influence is disclosed.'],
                  ['The final work adds a distinct mechanism, context or expression.', 'Licensing is checked.'],
                  ['Cosmetic edits are called transformation.', 'Attribution or license obligations are removed.'],
                  notes=['This repository preserves the historical Kleon adaptation but PROMPTS v2 must not imply ownership of Kleon’s original concepts.']
              ),
              module(
                  'development.secure-defaults', 'Secure Development Defaults', 'INVARIANT', 'ACTIVE',
                  [ref('APEX', 'HR-D2 Secure Defaults Lock')],
                  'Prevent common secret, injection, validation and error-handling failures in generated software.',
                  ['software-development', 'automation', 'data-processing'],
                  ['non-code tasks'], ['design', 'inputs', 'secret requirements'],
                  ['security requirements', 'implementation checks'], 'LOW', True,
                  ['Secrets are not hard-coded.', 'Inputs are validated.', 'Errors are explicit.', 'Queries and commands avoid unsafe concatenation.'],
                  ['Secret scan passes.', 'Negative input tests exist.', 'Dangerous operations are permission-gated.'],
                  ['Credential material enters source or trace.', 'Untrusted input reaches an interpreter unsafely.']
              ),
              module(
                  'development.resilience-and-test-baseline', 'Resilience and Test Baseline', 'CONFIGURABLE_POLICY', 'ACTIVE',
                  [ref('APEX', 'HR-D3 Resilience Pattern Lock', 'HR-D4 Test Baseline Lock')],
                  'Require failure handling and evidence proportionate to the software component’s external dependencies and risk.',
                  ['software-development', 'tool-integrations'],
                  ['static documents'], ['component', 'failure modes', 'risk profile'],
                  ['test plan', 'retry and timeout policy', 'graceful-failure behavior'], 'MEDIUM', True,
                  ['External calls have bounded time.', 'Retries are bounded and idempotency-aware.', 'Main and error paths are tested.'],
                  ['Tests execute rather than merely exist.', 'Repeated failure stops or escalates.'],
                  ['Unbounded retry loops.', 'Blanket circuit-breaker requirements on components with no external calls.'],
                  configurable_parameters={'coverage_target': 'task-pack-defined', 'retry_limit': 'risk-profile-defined'},
                  legacy_claims_not_imported=['One test per public function is not a universal quality measure.']
              ),
              module(
                  'workflow.minimum-viable-experiment', 'Minimum Viable Experiment', 'HEURISTIC', 'ACTIVE',
                  [ref('APEX', 'SR-1 MVE First', 'G3 Sanity Check Gate'), ref('VAL', '7-Phase Master Workflow')],
                  'Test the core mechanism cheaply before committing full resources or polishing the product surface.',
                  ['research', 'software', 'product-design', 'creative-production'],
                  ['final sealed evaluation'], ['hypothesis', 'core mechanism', 'budget'],
                  ['minimal experiment', 'go, repair or stop decision'], 'LOW', False,
                  ['The experiment must be capable of falsifying the core mechanism.', 'Prototype evidence is labeled as prototype evidence.'],
                  ['Sanity test executes.', 'Scale-up criteria are explicit.'],
                  ['A polished demo substitutes for a mechanism test.', 'The MVE becomes an endless prototype.']
              ),
              module(
                  'monitoring.scope-progress-claim', 'Scope, Progress and Claim Monitor', 'CONFIGURABLE_POLICY', 'ACTIVE',
                  [ref('APEX', 'M2 Progress Monitor', 'M3 Scope Monitor', 'M4 Claim Monitor')],
                  'Continuously detect no-progress loops, scope drift and claims that outrun evidence.',
                  ['long-running-agents', 'multi-phase-projects'],
                  ['single-response tasks'], ['state', 'budget', 'claims', 'evidence'],
                  ['warnings', 'mode transition', 'escalation record'], 'LOW', True,
                  ['No-progress is based on external state change.', 'Warnings can trigger repair, replan or stop.'],
                  ['Budget and state deltas are recorded.', 'Claim wording is checked before release.'],
                  ['The agent narrates progress without changing evidence or artifact.', 'Warnings have no enforcement effect.'],
                  configurable_parameters={'no_progress_window': 'task-pack-defined', 'time_overrun_threshold': 'task-pack-defined'}
              ),
              module(
                  'workflow.gated-phase-control', 'Gated Phase Control', 'CONFIGURABLE_POLICY', 'ACTIVE',
                  [ref('APEX', 'G1-G5 Gate System'), ref('VAL', '7-Phase Master Workflow')],
                  'Move work through explicit phases whose exit conditions are independently checkable.',
                  ['long-running-projects', 'research', 'software', 'publication'],
                  ['small atomic tasks'], ['contract', 'phase definition', 'gate checks'],
                  ['legal transition', 'failed gate', 'checkpoint'], 'MEDIUM', True,
                  ['A phase cannot close while a required gate is false.', 'Gate evidence is stored outside conversation.'],
                  ['Each phase has entry and exit checks.', 'Failed gates identify the next repair action.'],
                  ['The worker advances state by assertion.', 'Documentation completion is confused with project completion.'],
                  dependencies=['governance.success-criteria-lock']
              ),
              module(
                  'workflow.vibe-and-sustainability', 'Vibe and Sustainability Check', 'HEURISTIC', 'PROFILE_SPECIFIC',
                  [ref('VAL', 'Core Pillars', 'Vibe Check Protocol'), ref('KLEON', 'Part 5 Creative Routine Builder')],
                  'Track motivation, cognitive load and sustainable routine without allowing mood scores to waive evidence or safety gates.',
                  ['personal-creative-work', 'long-running-solo-projects'],
                  ['safety-critical-approval', 'objective completion decision'], ['project', 'energy', 'routine constraints'],
                  ['sustainability adjustments', 'defer or simplify suggestion'], 'LOW', False,
                  ['Vibe informs scheduling and scope proposals only.', 'Terminal success remains evidence-based.'],
                  ['The check changes workload or cadence rather than truth criteria.'],
                  ['A low or high score directly kills or validates a project.', 'Vibe is presented as an objective metric.'],
                  conflicts=['governance.success-criteria-lock'],
                  configurable_parameters={'cadence': 'user-defined'},
                  legacy_claims_not_imported=['Fixed 1–10 thresholds and universal creation-to-consumption ratios are not imported.']
              ),
          ]

          schema = json.loads(pathlib.Path('schemas/module.schema.json').read_text(encoding='utf-8'))
          validator = Draft202012Validator(schema)
          ids = set()
          written = []
          for item in modules:
              errors = sorted(validator.iter_errors(item), key=lambda e: list(e.path))
              if errors:
                  raise SystemExit(f"schema failure for {item['module_id']}: {errors[0].message}")
              if item['module_id'] in ids:
                  raise SystemExit(f"duplicate module id: {item['module_id']}")
              ids.add(item['module_id'])
              filename = item['module_id'].replace('.', '__') + '.module.json'
              path = OUT / filename
              payload = json.dumps(item, indent=2, ensure_ascii=False) + '\n'
              path.write_text(payload, encoding='utf-8')
              written.append({
                  'module_id': item['module_id'],
                  'path': str(path),
                  'sha256': hashlib.sha256(payload.encode('utf-8')).hexdigest(),
                  'classification': item['classification'],
                  'status': item['status'],
                  'default_include': item['default_include'],
              })

          by_class = collections.Counter(m['classification'] for m in modules)
          by_status = collections.Counter(m['status'] for m in modules)
          index = {
              'schema_version': '1.0.0',
              'catalog_id': 'prompts-v2.legacy-extracted',
