[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompts-v2-kernel"
version = "0.1.0"
description = "Deterministic module validator and selector for PROMPTS V2"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
promptctl = "promptctl.__main__:main"

[tool.setuptools]
packages = ["promptctl"]
