[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompts-v2-kernel"
version = "0.3.0"
description = "Deterministic prompt composer, reliability harness and benchmark packager for PROMPTS V2"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["jsonschema>=4.23,<5"]

[project.scripts]
promptctl = "promptctl.__main__:main"
promptbench = "promptctl.benchmark:main"

[tool.setuptools]
packages = ["promptctl"]
